<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIST 1680 - Linux Essentials | Course Hub</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-green: #3fb950;
            --accent-cyan: #58a6ff;
            --accent-purple: #bc8cff;
            --term-header: #21262d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Header Styles */
        header {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .badge {
            display: inline-block;
            background-color: rgba(88, 166, 255, 0.15);
            color: var(--accent-cyan);
            font-family: monospace;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 0.75rem;
            border: 1px solid rgba(88, 166, 255, 0.3);
        }

        h1 {
            font-size: 2.2rem;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .instructors {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-bottom: 1.5rem;
        }

        /* Terminal Bar */
        .terminal-box {
            background: #000;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            font-family: monospace;
        }

        .terminal-bar {
            background: var(--term-header);
            padding: 6px 12px;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green { background: #27c93f; }

        .terminal-content {
            padding: 12px 16px;
            color: var(--accent-green);
            font-size: 0.95rem;
        }

        .prompt { color: var(--accent-cyan); }

        /* Search & Filter Bar */
        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 250px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 0.75rem 1rem;
            border-radius: 6px;
            color: var(--text-main);
            font-size: 1rem;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }

        /* Section Styling */
        section {
            margin-bottom: 3rem;
        }

        .section-title {
            font-size: 1.5rem;
            color: #ffffff;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        /* Card Component */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1.25rem;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-cyan);
        }

        .card.summative:hover {
            border-color: var(--accent-purple);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .card-num {
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .card-link {
            display: inline-block;
            margin-top: 1rem;
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .summative .card-link {
            color: var(--accent-purple);
        }

        .card-link:hover {
            text-decoration: underline;
        }

        /* Checkbox for Completion Tracking */
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.75rem;
            cursor: pointer;
        }

        /* Footer */
        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <span class="badge">CNM | CIST 1680</span>
        <h1>Linux Essentials</h1>
        <div class="instructors">Instructors: Nathan & Co.</div>
        
        <div class="terminal-box">
            <div class="terminal-bar">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
            <div class="terminal-content">
                <span class="prompt">student@cnm-lab:~$</span> ./start_learning.sh --course cist1680
            </div>
        </div>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" class="search-input" placeholder="Search activities..." onkeyup="filterActivities()">
    </div>

    <!-- Formative Section -->
    <section>
        <h2 class="section-title" style="color: var(--accent-cyan);">
            <span>📖</span> Formative Activities (18)
        </h2>
        <div class="grid" id="formativeGrid"></div>
    </section>

    <!-- Summative Section -->
    <section>
        <h2 class="section-title" style="color: var(--accent-purple);">
            <span>🎯</span> Summative Activities (6)
        </h2>
        <div class="grid" id="summativeGrid"></div>
    </section>

    <footer>
        <p>Central New Mexico Community College &bull; CIST 1680 Course Materials</p>
    </footer>
</div>

<script>
    const totalFormative = 18;
    const totalSummative = 6;

    const formativeGrid = document.getElementById('formativeGrid');
    const summativeGrid = document.getElementById('summativeGrid');

    // Helper to pad numbers with leading zero (e.g., 1 -> 01)
    const pad = (num) => String(num).padStart(2, '0');

    // Generate Formative Activity Cards (Formative activity01.html ... 18)
    for (let i = 1; i <= totalFormative; i++) {
        const numStr = pad(i);
        const fileName = `Formative activity${numStr}.html`;
        const card = createCard(`Formative Activity ${numStr}`, fileName, `formative-${i}`, 'formative');
        formativeGrid.appendChild(card);
    }

    // Generate Summative Activity Cards (Summative activity01.html ... 06)
    for (let i = 1; i <= totalSummative; i++) {
        const numStr = pad(i);
        const fileName = `Summative activity${numStr}.html`;
        const card = createCard(`Summative Activity ${numStr}`, fileName, `summative-${i}`, 'summative');
        summativeGrid.appendChild(card);
    }

    // DOM Node Factory
    function createCard(title, filename, storageId, type) {
        const card = document.createElement('div');
        card.className = `card ${type}`;
        
        const isChecked = localStorage.getItem(storageId) === 'true';

        card.innerHTML = `
            <div>
                <div class="card-header">
                    <span class="card-num">${filename}</span>
                </div>
                <div class="card-title">${title}</div>
            </div>
            <div>
                <a href="${filename}" class="card-link" target="_blank">Launch Activity &rarr;</a>
                <label class="checkbox-container">
                    <input type="checkbox" onchange="toggleComplete('${storageId}', this)" ${isChecked ? 'checked' : ''}>
                    <span>Mark as completed</span>
                </label>
            </div>
        `;
        return card;
    }

    // Toggle local storage state for completed tasks
    function toggleComplete(id, element) {
        localStorage.setItem(id, element.checked);
    }

    // Client-side search filter
    function filterActivities() {
        const input = document.getElementById('searchInput').value.toLowerCase();
        const cards = document.querySelectorAll('.card');

        cards.forEach(card => {
            const text = card.textContent.toLowerCase();
            if (text.includes(input)) {
                card.style.display = "flex";
            } else {
                card.style.display = "none";
            }
        });
    }
</script>

</body>
</html>
